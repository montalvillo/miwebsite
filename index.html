<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

.contenedor{
    display:grid;
    grid-template-columns:300px 1fr;
    min-height:100vh;
}

/*-------------------
    COLUMNA IZQUIERDA
-------------------*/

.menu{
    background:#2c3e50;
    color:white;
    padding:25px;
}

.menu h2{
    text-align:center;
    margin-bottom:25px;
}

details{
    margin-bottom:15px;
    background:#34495e;
    border-radius:8px;
    overflow:hidden;
}

summary{
    padding:15px;
    cursor:pointer;
    font-weight:bold;
    list-style:none;
}

summary:hover{
    background:#1abc9c;
}

details a{
    display:block;
    padding:12px 20px;
    text-decoration:none;
    color:white;
    background:#3d566e;
    transition:.3s;
}

details a:hover{
    background:#16a085;
}


/*-------------------
    COLUMNA DERECHA
-------------------*/

.galeria{
    padding:30px;
}

.galeria h1{
    margin-bottom:30px;
    color:#333;
}

.imagenes{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;

}

.tarjeta{

    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    transition:.3s;

}

.tarjeta:hover{

    transform:scale(1.03);

}

.tarjeta img{

    width:100%;
    height:180px;
    object-fit:cover;

}

.tarjeta p{

    padding:15px;
    text-align:center;
    color:#333;
    font-weight:bold;

}

.tarjeta a{

    text-decoration:none;

}

/*-------------------
 RESPONSIVE
-------------------*/

@media(max-width:900px){

.contenedor{

grid-template-columns:1fr;

}

.menu{

width:100%;

}

}

</style>

</head>
